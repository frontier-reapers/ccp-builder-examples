#version: "3.8"

services:
  foundry:
    container_name: foundry
    image: ghcr.io/foundry-rs/foundry:stable
    platform: linux/amd64 # Specify the platform
    entrypoint: anvil --block-time 1 --block-base-fee-per-gas 0 --gas-limit 3000000000 --hardfork cancun --host 0.0.0.0 --port 8546
    ports:
      - "8546:8546"
    healthcheck:
      test: ["CMD-SHELL", "cast rpc eth_blockNumber --rpc-url http://127.0.0.1:8546 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  world-deployer:
    container_name: world-deployer
    image: ghcr.io/projectawakening/world-chain-deployer-image:0.1.16
    platform: linux/amd64
    depends_on:
      foundry:
        condition: service_healthy
    command: "deploy-v2 --rpc-url http://foundry:8546 --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    tty: true
    env_file:
      - world.env